<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #f4f7f6; padding: 20px; }
        .card { max-width: 500px; margin: auto; background: #fff; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background: #e74c3c; color: white; padding: 20px; text-align: center; }
        .header h1 { margin: 0; font-size: 24px; }
        .content { padding: 30px; text-align: center; color: #333; }
        .content h2 { margin-top: 0; color: #333; }
        .content p { font-size: 16px; line-height: 1.6; color: #555; }
        .btn { display: inline-block; background: #2ecc71; color: white; text-decoration: none; padding: 12px 25px; border-radius: 5px; margin-top: 20px; font-weight: bold; }
        .footer { text-align: center; padding: 15px; color: #777; font-size: 12px; background: #f8f9fa; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h1>Membership Expired</h1>
        </div>
        <div class="content">
            <h2>Hello {{ name }},</h2>
            <p>Your gym membership has expired today. We miss seeing you at the gym!</p>
            <p>Please click the button below or visit the front desk to renew your membership and continue your fitness journey.</p>
            <a href="#" class="btn">Renew Membership</a>
        </div>
        <div class="footer">&copy; 2024 Spartan Fitness Zone. All rights reserved.</div>
    </div>
</body>
</html>
